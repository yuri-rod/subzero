[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subzero-cli"
version = "1.2.0"
description = "Universal subtitle & audio AI toolkit: clean SDH, auto-sync, shift, convert, extract, and translate with zero setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Yuri Barreira" }]
keywords = [
    "subtitles",
    "srt",
    "vtt",
    "ass",
    "sdh",
    "sync",
    "whisper",
    "ollama",
    "ffmpeg",
    "jellyfin",
    "plex",
    "media",
    "audio-sync",
    "translation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.26,<3"]
sync = ["numpy>=1.26", "faster-whisper>=1.1,<2"]

[project.scripts]
subzero = "subzero.cli:main"
sdhfix = "subzero.cli:main"

[project.urls]
Homepage = "https://github.com/yuri-rod/subzero"
Repository = "https://github.com/yuri-rod/subzero"
Issues = "https://github.com/yuri-rod/subzero/issues"
Funding = "https://buymeacoffee.com/yurirod"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
