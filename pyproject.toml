[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subzero-cli"
version = "1.3.0"
description = "Universal subtitle & audio AI toolkit: clean SDH, auto-sync, shift, convert, extract, translate, and background worker daemon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Yuri Barreira" }]
keywords = [
    "subtitles",
    "srt",
    "vtt",
    "ass",
    "sdh",
    "sync",
    "whisper",
    "ollama",
    "ffmpeg",
    "jellyfin",
    "plex",
    "media",
    "audio-sync",
    "translation",
    "worker",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "numpy>=1.26,<3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.1,<2",
    "huggingface_hub>=0.23",
    "python-multipart>=0.0.9",
]
sync = [
    "numpy>=1.26",
    "faster-whisper>=1.1,<2",
]
worker = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "faster-whisper>=1.1,<2",
    "huggingface_hub>=0.23",
    "python-multipart>=0.0.9",
]
all = [
    "subzero-cli[sync,worker]",
]

[project.scripts]
subzero = "subzero.cli:main"
sdhfix = "subzero.cli:main"
srtworker = "subzero.worker.__main__:main"

[project.urls]
Homepage = "https://github.com/yuri-rod/subzero"
Repository = "https://github.com/yuri-rod/subzero"
Issues = "https://github.com/yuri-rod/subzero/issues"
Funding = "https://buymeacoffee.com/yurirod"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
